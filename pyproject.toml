[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-monitor"
version = "0.1.0"
description = "Lightweight data quality monitoring for Python. No YAML. No dependencies. Just checks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shubham Safaya", email = "safayashubham@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
]
keywords = ["data-quality", "validation", "monitoring", "checks", "profiling"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/Shubham-Safaya/data-quality-monitor"
Repository = "https://github.com/Shubham-Safaya/data-quality-monitor"
Issues = "https://github.com/Shubham-Safaya/data-quality-monitor/issues"

[tool.setuptools.packages.find]
include = ["data_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["data_quality"]
